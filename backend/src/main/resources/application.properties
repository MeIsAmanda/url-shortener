spring.application.name=url-shortener
server.port=${PORT:8080}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/shortener}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
# H2 otherwise delays flushing committed writes by up to 500 ms. Apply this on
# every pooled connection so custom H2 DATABASE_URL values retain the policy.
spring.datasource.hikari.connection-init-sql=SET WRITE_DELAY 0
spring.jpa.hibernate.ddl-auto=validate
# Adopt the pre-Flyway H2 schema at version 0, then apply versioned migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
